# ARIA AI — local development entrypoint.
#
# The real dev topology lives in infra/docker-compose.yml
# (aria-api on :8080 + worker + redis). This file is a thin wrapper so
# `docker compose up` works from the repo root.
#
# Secrets: copy .env.example -> .env and fill in values. Never commit .env.
# No passwords are hardcoded in this file — not even for local dev.

include:
  - infra/docker-compose.yml
